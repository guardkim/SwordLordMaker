name: Unity WebGL Mobile Build
run-name: WebGL-Mobile build by ${{ github.actor }} (${{ github.ref_name }})

# =========================
# ✅ 사용자 설정 구간 (여기만 바꾸면 됨)
# =========================
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - develop
      # - "mobile/**"

concurrency:
  group: unity-webgl-mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

# 사용자 설정 변수들
env:
  # --- Unity Build ---
  PROJECT_PATH: .
  TARGET_PLATFORM: WebGL
  BUILD_NAME: Web-Mobile
  BUILDS_PATH: build
  BUILD_PROFILE: "Assets/Settings/Build Profiles/Web - Mobile - Development.asset"

  # --- itch.io Deploy ---
  ITCH_USER: guardkim
  ITCH_GAME: swordlordmaker
  ITCH_CHANNEL: web-mobile
  ITCH_USER_VERSION: "${{ github.ref_name }}-${{ github.run_number }}"

  # --- Slack Message ---
  SLACK_TITLE: "Unity WebGL Mobile 빌드/배포"
  SLACK_DEPLOY_SPEC: "guardkim/swordlordmaker:web-mobile"

jobs:
  build-webgl-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # (중요) Unity Docker 이미지 풀 때 디스크 부족 자주 발생 -> 미리 공간 확보
      - name: Free disk space (before Unity Docker pull)
        shell: bash
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo docker system prune -af || true
          df -h

      # Unity Library 캐시(빌드 속도 향상)
      - name: Cache Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-
            Library-${{ runner.os }}-

      - name: Build (Unity Builder)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          unityVersion: auto
          buildProfile: ${{ env.BUILD_PROFILE }}
          buildsPath: ${{ env.BUILDS_PATH }}
          buildName: ${{ env.BUILD_NAME }}

      - name: Upload Artifact (WebGL-Mobile)
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Mobile-${{ github.ref_name }}-${{ github.run_number }}
          path: ${{ env.BUILDS_PATH }}
          retention-days: 7

      # 배포는 main 또는 수동 실행일 때만 (원하면 조건 수정)
      - name: Setup butler
        uses: remarkablegames/setup-butler@v2
        if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'

      - name: Deploy to itch.io (WebGL Mobile)
        if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        shell: pwsh
        run: |
          $buildDir = "${{ env.BUILDS_PATH }}/${{ env.TARGET_PLATFORM }}/${{ env.BUILD_NAME }}"
          $spec = "$($env:ITCH_USER)/$($env:ITCH_GAME):$($env:ITCH_CHANNEL)"

          echo "Deploying: $buildDir"
          echo "Spec: $spec"

          if (!(Test-Path $buildDir)) { throw "Build output not found: $buildDir" }

          butler push "$buildDir" "$spec" --userversion "${{ env.ITCH_USER_VERSION }}"

      # ✅ 이전 "성공한" 빌드(run)의 head_sha 가져오기
      - name: Get previous successful build SHA
        id: prev_success
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowName = context.workflow; // 현재 워크플로 'name'
            const branch = context.ref.replace('refs/heads/', '');
            const currentRunId = context.runId;

            const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo, per_page: 100 });
            const wf = workflows.data.workflows.find(w => w.name === workflowName);

            if (!wf) {
              core.warning(`Workflow not found by name: ${workflowName}`);
              core.setOutput('sha', '');
              return;
            }

            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: wf.id,
              branch,
              status: 'completed',
              per_page: 50
            });

            const prev = runs.data.workflow_runs.find(r => r.id !== currentRunId && r.conclusion === 'success');
            core.setOutput('sha', prev ? prev.head_sha : '');

      # ✅ 커밋 변경내역: "이전 성공 빌드 커밋" -> "현재 커밋" 사이를 전부 추출
      - name: Collect commit changes (since last successful build)
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          AFTER="${GITHUB_SHA}"
          PREV_SUCCESS="${{ steps.prev_success.outputs.sha }}"

          if [[ -n "${PREV_SUCCESS}" && "${PREV_SUCCESS}" != "${AFTER}" ]]; then
            RANGE="${PREV_SUCCESS}..${AFTER}"
            echo "지난 성공 빌드 이후 변경 내역" > changes_title.txt
          else
            # fallback: 이전 성공 빌드가 없으면 이번 push 범위(또는 직전 커밋)로
            BEFORE="${{ github.event.before }}"
            if [[ -z "${BEFORE}" || "${BEFORE}" == "0000000000000000000000000000000000000000" ]]; then
              if git rev-parse "${AFTER}~1" >/dev/null 2>&1; then
                BEFORE="$(git rev-parse "${AFTER}~1")"
              else
                BEFORE="${AFTER}"
              fi
            fi
            RANGE="${BEFORE}..${AFTER}"
            echo "최근 변경 내역" > changes_title.txt
          fi

          # 오래된 -> 최신 순으로 보여주기(--reverse)
          git log --reverse --pretty=format:'• %s (%h) - %an' "${RANGE}" > commit_log.txt || true

          if [[ ! -s commit_log.txt ]]; then
            echo "• 변경 내역 없음" > commit_log.txt
          fi

          wc -l commit_log.txt | awk '{print $1}' > commit_count.txt

      # Slack payload를 Python으로 JSON 생성 (커밋이 많아도 블록 여러 개로 분할)
      - name: Build Slack payload (json)
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          status = os.environ.get("JOB_STATUS", "unknown")
          if status == "success":
            emoji, result = "✅", "성공"
          elif status == "failure":
            emoji, result = "❌", "실패"
          else:
            emoji, result = "⚠️", "중단/취소"

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          branch = os.environ.get("GITHUB_REF_NAME", "")
          run_number = os.environ.get("GITHUB_RUN_NUMBER", "")
          actor = os.environ.get("GITHUB_ACTOR", "")
          server_url = os.environ.get("GITHUB_SERVER_URL", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          run_url = f"{server_url}/{repo}/actions/runs/{run_id}" if server_url and repo and run_id else ""

          title = os.environ.get("SLACK_TITLE", "Unity 빌드")
          deploy_spec = os.environ.get("SLACK_DEPLOY_SPEC", "")
          version = os.environ.get("ITCH_USER_VERSION", "")

          def read_text(path, default=""):
            p = pathlib.Path(path)
            return p.read_text(encoding="utf-8", errors="replace").strip() if p.exists() else default

          changes_title = read_text("changes_title.txt", "변경 내역")
          log_text = read_text("commit_log.txt", "• 변경 내역 없음")
          commit_count = read_text("commit_count.txt", "0")

          # Slack mrkdwn section text limit ~3000 chars -> 안전하게 2800으로 분할
          MAX_CHARS = 2800
          lines = log_text.splitlines()

          chunks = []
          cur = ""
          for line in lines:
            add = (line + "\n")
            if len(cur) + len(add) > MAX_CHARS:
              chunks.append(cur.rstrip())
              cur = add
            else:
              cur += add
          if cur.strip():
            chunks.append(cur.rstrip())

          # Slack blocks max 50. 고정 블록 4개 사용 -> 변경내역 블록 최대 45개만 허용 + 마지막 안내 1개
          MAX_CHANGE_BLOCKS = 45
          too_many = len(chunks) > MAX_CHANGE_BLOCKS
          if too_many:
            shown = chunks[:MAX_CHANGE_BLOCKS]
          else:
            shown = chunks

          fields = [
            {"type": "mrkdwn", "text": f"*저장소*\n`{repo}`"},
            {"type": "mrkdwn", "text": f"*브랜치*\n`{branch}`"},
            {"type": "mrkdwn", "text": f"*실행 번호*\n#{run_number}"},
            {"type": "mrkdwn", "text": f"*실행자*\n`{actor}`"},
          ]
          if deploy_spec:
            fields.append({"type": "mrkdwn", "text": f"*배포 대상*\n`{deploy_spec}`"})
          if version:
            fields.append({"type": "mrkdwn", "text": f"*버전*\n`{version}`"})

          blocks = [
            {"type": "header", "text": {"type": "plain_text", "text": f"{emoji} {title} {result}", "emoji": True}},
            {"type": "section", "fields": fields},
            {"type": "section", "text": {"type": "mrkdwn", "text": f"*실행 링크*\n<{run_url}|GitHub Actions 열기>"}},
            {"type": "divider"},
            {"type": "section", "text": {"type": "mrkdwn", "text": f"*{changes_title}* (총 {commit_count}개)\n(표시는 오래된 → 최신 순)"}},
          ]

          for c in shown:
            blocks.append({"type": "section", "text": {"type": "mrkdwn", "text": c}})

          if too_many:
            blocks.append({"type": "section", "text": {"type": "mrkdwn", "text": f"⚠️ 변경 내역이 너무 많아서 일부만 표시했어요. (Slack 제한 때문에 생략됨)"} })

          payload = {"blocks": blocks}

          with open("slack-payload.json", "w", encoding="utf-8") as f:
            json.dump(payload, f, ensure_ascii=False)

          PY

      - name: Notify Slack (always)
        if: always()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: slack-payload.json
