name: Unity WebGL Mobile Build
run-name: WebGL-Mobile build by ${{ github.actor }} (${{ github.ref_name }})

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - develop
  # 필요하면 스케줄도 켜세요(UTC 기준)
  # schedule:
  #   - cron: "0 19 * * *" # KST 04:00

concurrency:
  group: unity-WebGL-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PROJECT_PATH: .
      TARGET_PLATFORM: WebGL
      BUILD_NAME: Web-Mobile
      BUILDS_PATH: build
      BUILD_PROFILE: "Assets/Settings/Build Profiles/Web - Mobile - Development.asset"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Unity Library 캐시(빌드 속도 향상)
      - name: Cache Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-
            Library-${{ runner.os }}-

      - name: Free disk space (before Unity Docker pull)
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          df -h


      - name: Build (Unity Builder)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          unityVersion: auto
          buildProfile: ${{ env.BUILD_PROFILE }}
          buildsPath: ${{ env.BUILDS_PATH }}
          buildName: ${{ env.BUILD_NAME }}

      - name: Upload Artifact (WebGL-Mobile)
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Mobile-${{ github.ref_name }}-${{ github.run_number }}
          path: ${{ env.BUILDS_PATH }}
          retention-days: 7

      - name: Setup butler
        uses: remarkablegames/setup-butler@v2
        if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'

      - name: Deploy to itch.io (WebGL Mobile)
        if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: guardkim
          ITCH_GAME: swordlordmaker
          ITCH_CHANNEL: web-mobile
        shell: pwsh
        run: |
          $buildDir = "${{ env.BUILDS_PATH }}/${{ env.TARGET_PLATFORM }}/${{ env.BUILD_NAME }}"
          $spec = "$($env:ITCH_USER)/$($env:ITCH_GAME):$($env:ITCH_CHANNEL)"

          echo "Deploying: $buildDir"
          echo "Spec: $spec"

          if (!(Test-Path $buildDir)) { throw "Build output not found: $buildDir" }

          butler push "$buildDir" "$spec" --userversion "${{ github.ref_name }}-${{ github.run_number }}"


      - name: Collect commit changes
        id: changes
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          AFTER="${GITHUB_SHA}"
          BEFORE="${{ github.event.before }}"

          # workflow_dispatch 등에서 before가 없을 수 있어서 fallback
          if [[ -z "${BEFORE}" || "${BEFORE}" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse "${AFTER}~1" >/dev/null 2>&1; then
              BEFORE="$(git rev-parse "${AFTER}~1")"
            else
              BEFORE="${AFTER}"
            fi
          fi

          RANGE="${BEFORE}..${AFTER}"
          echo "range=${RANGE}" >> "$GITHUB_OUTPUT"

          LOG="$(git log --pretty=format:'• %s (`%h`) - %an' "${RANGE}" | head -n 10 || true)"
          if [[ -z "${LOG}" ]]; then LOG="• 변경 내역 없음"; fi
          printf "log<<EOF\n%s\nEOF\n" "${LOG}" >> "$GITHUB_OUTPUT"

      - name: Build Slack payload (json)
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          STATUS="${{ job.status }}"
          if [[ "$STATUS" == "success" ]]; then
            EMOJI="✅"; RESULT="성공"
          else
            EMOJI="❌"; RESULT="실패"
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DEPLOY_SPEC="guardkim/swordlordmaker:web-mobile"

          jq -n \
            --arg title "${EMOJI} Unity WebGL Mobile 빌드/배포 ${RESULT}" \
            --arg repo "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg runnum "${{ github.run_number }}" \
            --arg deploy "${DEPLOY_SPEC}" \
            --arg range "${{ steps.changes.outputs.range }}" \
            --arg runurl "${RUN_URL}" \
            --arg changes "${{ steps.changes.outputs.log }}" \
            '{
              blocks: [
                {type:"header", text:{type:"plain_text", text:$title, emoji:true}},
                {type:"section", fields:[
                  {type:"mrkdwn", text:"*저장소*\n`"+$repo+"`"},
                  {type:"mrkdwn", text:"*브랜치*\n`"+$branch+"`"},
                  {type:"mrkdwn", text:"*실행 번호*\n#"+$runnum},
                  {type:"mrkdwn", text:"*배포 대상*\n`"+$deploy+"`"},
                  {type:"mrkdwn", text:"*커밋 범위*\n`"+$range+"`"},
                  {type:"mrkdwn", text:"*실행 링크*\n<"+$runurl+"|GitHub Actions 열기>"}
                ]},
                {type:"divider"},
                {type:"section", text:{type:"mrkdwn", text:"*변경 내역(최대 10개)*\n"+$changes}}
              ]
            }' > slack-payload.json


      - name: Notify Slack (always)
        if: always()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: slack-payload.json



