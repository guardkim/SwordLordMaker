name: Unity WebGL Mobile Build
run-name: WebGL-Mobile build by ${{ github.actor }} (${{ github.ref_name }})

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - develop

concurrency:
  group: unity-WebGL-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PROJECT_PATH: .
      TARGET_PLATFORM: WebGL
      BUILD_NAME: Web-Mobile
      BUILDS_PATH: build
      BUILD_PROFILE: "Assets/Settings/Build Profiles/Web - Mobile - Development.asset"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # (중요) Unity Docker 이미지 풀 때 디스크 부족 자주 발생 -> 미리 공간 확보
      - name: Free disk space (before Unity Docker pull)
        shell: bash
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo docker system prune -af || true
          df -h

      # Unity Library 캐시(빌드 속도 향상)
      - name: Cache Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-
            Library-${{ runner.os }}-

      - name: Build (Unity Builder)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          unityVersion: auto
          buildProfile: ${{ env.BUILD_PROFILE }}
          buildsPath: ${{ env.BUILDS_PATH }}
          buildName: ${{ env.BUILD_NAME }}

      - name: Upload Artifact (WebGL-Mobile)
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Mobile-${{ github.ref_name }}-${{ github.run_number }}
          path: ${{ env.BUILDS_PATH }}
          retention-days: 7

      - name: Setup butler
        uses: remarkablegames/setup-butler@v2
        if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'

      - name: Deploy to itch.io (WebGL Mobile)
        if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: guardkim
          ITCH_GAME: swordlordmaker
          ITCH_CHANNEL: web-mobile
        shell: pwsh
        run: |
          $buildDir = "${{ env.BUILDS_PATH }}/${{ env.TARGET_PLATFORM }}/${{ env.BUILD_NAME }}"
          $spec = "$($env:ITCH_USER)/$($env:ITCH_GAME):$($env:ITCH_CHANNEL)"

          echo "Deploying: $buildDir"
          echo "Spec: $spec"

          if (!(Test-Path $buildDir)) { throw "Build output not found: $buildDir" }

          butler push "$buildDir" "$spec" --userversion "${{ github.ref_name }}-${{ github.run_number }}"

      # 커밋 변경내역 파일로 저장 (멀티라인/특수문자 안전)
      - name: Collect commit changes
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          AFTER="${GITHUB_SHA}"
          BEFORE="${{ github.event.before }}"

          # workflow_dispatch 등에서 before가 없을 수 있어서 fallback
          if [[ -z "${BEFORE}" || "${BEFORE}" == "0000000000000000000000000000000000000000" ]]; then
            if git rev-parse "${AFTER}~1" >/dev/null 2>&1; then
              BEFORE="$(git rev-parse "${AFTER}~1")"
            else
              BEFORE="${AFTER}"
            fi
          fi

          RANGE="${BEFORE}..${AFTER}"
          echo "${RANGE}" > commit_range.txt

          # backtick 등 문제 피하려고 포맷에서 ` 사용 안 함
          git log --pretty=format:'• %s (%h) - %an' "${RANGE}" | head -n 10 > commit_log.txt || true
          if [[ ! -s commit_log.txt ]]; then
            echo "• 변경 내역 없음" > commit_log.txt
          fi

      # Slack payload를 Python으로 JSON 생성 (파싱 깨짐 방지)
      - name: Build Slack payload (json)
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOY_SPEC: guardkim/swordlordmaker:web-mobile
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          status = os.environ.get("JOB_STATUS", "unknown")
          if status == "success":
            emoji, result = "✅", "성공"
          elif status == "failure":
            emoji, result = "❌", "실패"
          else:
            emoji, result = "⚠️", "중단/취소"

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          branch = os.environ.get("GITHUB_REF_NAME", "")
          run_number = os.environ.get("GITHUB_RUN_NUMBER", "")
          actor = os.environ.get("GITHUB_ACTOR", "")
          server_url = os.environ.get("GITHUB_SERVER_URL", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          run_url = f"{server_url}/{repo}/actions/runs/{run_id}" if server_url and repo and run_id else ""
          deploy_spec = os.environ.get("DEPLOY_SPEC", "")

          version = f"{branch}-{run_number}" if branch and run_number else ""

          commit_range = ""
          log_text = ""

          p_range = pathlib.Path("commit_range.txt")
          p_log = pathlib.Path("commit_log.txt")

          if p_range.exists():
            commit_range = p_range.read_text(encoding="utf-8", errors="replace").strip()
          if p_log.exists():
            log_text = p_log.read_text(encoding="utf-8", errors="replace").strip()

          if not log_text:
            log_text = "• 변경 내역 없음"

          payload = {
            "blocks": [
              {"type": "header", "text": {"type": "plain_text", "text": f"{emoji} Unity WebGL Mobile 빌드/배포 {result}", "emoji": True}},
              {"type": "section", "fields": [
                {"type": "mrkdwn", "text": f"*저장소*\n`{repo}`"},
                {"type": "mrkdwn", "text": f"*브랜치*\n`{branch}`"},
                {"type": "mrkdwn", "text": f"*실행 번호*\n#{run_number}"},
                {"type": "mrkdwn", "text": f"*실행자*\n`{actor}`"},
                {"type": "mrkdwn", "text": f"*배포 대상*\n`{deploy_spec}`"},
                {"type": "mrkdwn", "text": f"*버전*\n`{version}`"},
              ]},
              {"type": "section", "text": {"type": "mrkdwn", "text": f"*커밋 범위*\n`{commit_range}`\n*실행 링크*\n<{run_url}|GitHub Actions 열기>"}},
              {"type": "divider"},
              {"type": "section", "text": {"type": "mrkdwn", "text": f"*변경 내역(최대 10개)*\n{log_text}"}},
            ]
          }

          with open("slack-payload.json", "w", encoding="utf-8") as f:
            json.dump(payload, f, ensure_ascii=False)

          print("Wrote slack-payload.json")
          PY

      - name: Notify Slack (always)
        if: always()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: slack-payload.json
