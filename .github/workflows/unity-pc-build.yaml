name: Unity WebGL Desktop Build (Windows)
run-name: WebGL Desktop build by ${{ github.actor }} (${{ github.ref_name }})

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - develop
  # 필요하면 스케줄도 켜세요(UTC 기준)
  # schedule:
  #   - cron: "0 19 * * *" # KST 04:00

concurrency:
  group: unity-pc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pc:
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      PROJECT_PATH: .
      TARGET_PLATFORM: WebGL
      BUILD_NAME: Web-Desktop
      BUILDS_PATH: build
      BUILD_PROFILE: "Assets/Settings/Build Profiles/Web - Desktop - Release.asset"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.TARGET_PLATFORM }}-
            Library-${{ runner.os }}-

      - name: Build (Unity Builder)
        uses: game-ci/unity-builder@v4
        env:
          # ✅ Personal License
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          unityVersion: auto
          buildProfile: ${{ env.BUILD_PROFILE }}
          buildsPath: ${{ env.BUILDS_PATH }}
          buildName: ${{ env.BUILD_NAME }}

      - name: Upload Artifact (WebGL-Desktop)
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Desktop-${{ github.ref_name }}-${{ github.run_number }}
          path: ${{ env.BUILDS_PATH }}
          retention-days: 7

      - name: Setup butler
        uses: remarkablegames/setup-butler@v2
        if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'

      - name: Deploy to itch.io (WebGL Desktop)
        if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: guardkim
          ITCH_GAME: swordlordmaker
          ITCH_CHANNEL: web-desktop
        shell: pwsh
        run: |
          $buildDir = "${{ env.BUILDS_PATH }}\${{ env.TARGET_PLATFORM }}\${{ env.BUILD_NAME }}"
          echo "Deploying: $buildDir"
          if (!(Test-Path $buildDir)) { throw "Build output not found: $buildDir" }

          butler push $buildDir "$env:ITCH_USER/$env:ITCH_GAME:$env:ITCH_CHANNEL" --userversion "${{ github.ref_name }}-${{ github.run_number }}"

      - name: Notify Slack (always)
        if: always()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*Build*: ${{ github.repository }}\n*Status*: ${{ job.status }}\n*Run*: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
